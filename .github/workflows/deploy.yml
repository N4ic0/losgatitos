name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Verify build output
        run: |
          echo "Build files:"
          ls -la src/public/build/
          echo "Manifest:"
          cat src/public/build/manifest.json | head -5
