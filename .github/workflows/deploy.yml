name: Deploy a Produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: src/
          server-dir: /
          exclude: |
            .env
            .env.example
            .gitignore
            node_modules/
            storage/logs/.gitignore
            storage/framework/cache/data/.gitignore
            tests/
            docker-compose.yml
            docker-compose.opencode.yml
            Dockerfile
            phpunit.xml
            README.md
