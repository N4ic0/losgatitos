name: Deploy a Produccion

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Deploy via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null

          cd src

          lftp -c "
            set ftp:passive-mode off
            set ftp:ssl-allow no
            set net:timeout 120
            set net:max-retries 3
            set net:reconnect-interval-base 10
            set mirror:parallel-transfer-count 5
            set mirror:use-pget-n 5
            open -u \"\$FTP_USER\",\"\$FTP_PASS\" \$FTP_HOST
            mirror -R \
              --exclude .env \
              --exclude .env.example \
              --exclude .gitignore \
              --exclude node_modules/ \
              --exclude tests/ \
              --exclude docker-compose.yml \
              --exclude docker-compose.opencode.yml \
              --exclude Dockerfile \
              --exclude phpunit.xml \
              --exclude README.md \
              --delete \
              . /
            quit
          "
