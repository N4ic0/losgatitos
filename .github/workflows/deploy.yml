name: Deploy a Produccion

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (8.4 para build, server parcheado para 8.3)
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, pdo_mysql, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader --ignore-platform-req=php

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Prepare files for FTP
        run: |
          cd src
          cp public_html/.htaccess ./

      - name: Deploy via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null

          cd src

          lftp -c "
            set ftp:passive-mode off
            set ftp:ssl-allow no
            set net:timeout 300
            set net:max-retries 5
            set net:reconnect-interval-base 15
            set mirror:parallel-transfer-count 10
            set mirror:use-pget-n 10
            set mirror:fail-retry yes
            open -u \"\$FTP_USER\",\"\$FTP_PASS\" \$FTP_HOST
            mirror -R \
              --exclude public_html/ \
              --verbose \
              . /
            quit
          "
