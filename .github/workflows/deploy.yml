name: Deploy a Produccion

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar archivos cambiados
        id: changed
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            composer_changed=true
            assets_changed=true
            changed_files=""
          else
            changed=$(git diff --name-only "$BEFORE" HEAD || true)
            composer_changed=false
            assets_changed=false
            for f in $changed; do
              case "$f" in
                composer.lock|composer.json|src/composer.lock|src/composer.json|vendor/*|src/vendor/*)
                  composer_changed=true;;
                package*.json|src/package*.json|resources/*|src/resources/*|vite.config.*|src/vite.config.*)
                  assets_changed=true;;
              esac
            done
            # Solo archivos que se suben al servidor (dentro de src/, excluyendo pesados/sensibles)
            changed_files=$(git diff --name-only "$BEFORE" HEAD -- src || true | \
              sed 's#^src/##' | \
              grep -vE '(^|/)(node_modules|vendor|tests)/' | \
              grep -vE '(^|/)\.env(\.|$)|\.env\.example|docker-compose|Dockerfile|phpunit\.xml|README\.md|\.gitignore|\.htaccess|public/storage/' || true)
          fi
          # Modo de deploy:
          #   - ALL    : cambio composer/vendor -> mirror completo
          #   - changed: hay archivos en src/ que subir
          #   - none   : no hay nada que subir en src/ (p.ej. push solo de deploy.yml)
          if [ "$composer_changed" = "true" ]; then
            echo "ALL" > /tmp/changed_files.txt
          elif [ -n "$changed_files" ]; then
            echo "$changed_files" > /tmp/changed_files.txt
          else
            echo "NONE" > /tmp/changed_files.txt
          fi
          echo "composer_changed=$composer_changed"
          echo "assets_changed=$assets_changed"
          echo "composer_changed=$composer_changed" >> $GITHUB_OUTPUT
          echo "assets_changed=$assets_changed" >> $GITHUB_OUTPUT
          echo "Numero de archivos a subir: $(wc -l < /tmp/changed_files.txt)"

      - name: Setup PHP (8.3)
        if: steps.changed.outputs.composer_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_mysql, intl
          tools: composer:v2

      - name: Cache Composer
        if: steps.changed.outputs.composer_changed == 'true'
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        if: steps.changed.outputs.composer_changed == 'true'
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Setup Node
        if: steps.changed.outputs.assets_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Cache Node modules
        if: steps.changed.outputs.assets_changed == 'true'
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ hashFiles('src/package-lock.json') }}
          restore-keys: npm-

      - name: Install Node dependencies & build assets
        if: steps.changed.outputs.assets_changed == 'true'
        run: cd src && npm ci && npm run build

      - name: Deploy via FTP (only changed files)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null

          cd src

          # El archivo down activa el modo mantenimiento de Laravel (503 con aviso)
          mkdir -p /tmp/down-dir && echo "Deploy en curso, vuelva en unos momentos." > /tmp/down

          # Si hay una lista real de archivos cambiados, subir SOLO esos (deploy en segundos).
          # Si la lista es "ALL" (cambio composer/nuevo repo) se usa mirror completo.
          # La lista "NONE" (sin cambios en src/) no sube nada.
          CHANGE_FILE=/tmp/changed_files.txt
          MODE=$(cat "$CHANGE_FILE" 2>/dev/null || echo "NONE")
          if [ "$MODE" = "ALL" ]; then
            DEPLOY_MODE=all
          elif [ "$MODE" = "NONE" ]; then
            DEPLOY_MODE=none
          else
            DEPLOY_MODE=changed
          fi
          echo "Modo deploy: $DEPLOY_MODE"

          if [ "$DEPLOY_MODE" = "changed" ]; then
            # Construir un arbol temporal SOLO con los archivos cambiados,
            # conservando su estructura de directorios relativa a src/.
            # Luego un UNICO mirror -R del arbol sube todo de forma fiable
            # (lftp mirror por archivo individual no es fiable y sube 0 archivos).
            rm -rf /tmp/staging
            mkdir -p /tmp/staging
            COUNT=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # Quitar prefijo src/ por seguridad (nunca deben quedar rutas src/src/...)
              f="${f#src/}"
              [ -f "./$f" ] || continue
              mkdir -p "/tmp/staging/$(dirname "$f")"
              cp "./$f" "/tmp/staging/$f"
              COUNT=$((COUNT+1))
            done < "$CHANGE_FILE"
            echo "Archivos a subir: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "Sin archivos validos para subir (modo NONE)."
              exit 0
            fi
            {
              echo "set ftp:passive-mode off"
              echo "set ftp:ssl-allow yes"
              echo "set ssl:verify-certificate no"
              echo "set net:timeout 60"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set mirror:parallel-transfer-count 20"
              echo "set mirror:use-pget-n 20"
              echo "open -u $FTP_USER,$FTP_PASS $FTP_HOST"
              # Modo mantenimiento ANTES de tocar archivos: evita 500 durante el deploy
              echo "put /tmp/down -o storage/framework/down"
              # Subir SOLO el arbol con los archivos modificados (mirror sin --delete: nunca borra)
              echo "mirror -R --continue /tmp/staging/ /"
              # Limpiar caches (sin borrar vistas compiladas: Laravel las recompila sola)
              echo "rm -f bootstrap/cache/routes-*.php"
              echo "rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php"
              # Salir de modo mantenimiento al terminar (ultimo paso)
              echo "rm -f storage/framework/down"
              echo "quit"
            } > /tmp/lftp.cmd

            lftp -f /tmp/lftp.cmd
          elif [ "$DEPLOY_MODE" = "all" ]; then
            {
              echo "set ftp:passive-mode off"
              echo "set ftp:ssl-allow yes"
              echo "set ssl:verify-certificate no"
              echo "set net:timeout 60"
              echo "set net:max-retries 3"
              echo "set net:reconnect-interval-base 5"
              echo "set mirror:parallel-transfer-count 20"
              echo "set mirror:use-pget-n 20"
              echo "open -u $FTP_USER,$FTP_PASS $FTP_HOST"
              # Modo mantenimiento ANTES de tocar archivos: evita 500 durante el deploy
              echo "put /tmp/down -o storage/framework/down"
              echo "mirror -R --only-newer --exclude node_modules/ --exclude tests/ --exclude .env --exclude .env.example --exclude .gitignore --exclude docker-compose.yml --exclude docker-compose.opencode.yml --exclude Dockerfile --exclude phpunit.xml --exclude README.md --exclude .htaccess --exclude bootstrap/cache/ --exclude public/storage/ --exclude storage/app/public/ --exclude storage/framework/cache/ --exclude storage/framework/sessions/ --exclude storage/framework/views/ --exclude storage/logs/ --exclude storage/framework/down . /"
              # Limpiar caches (sin borrar vistas compiladas: Laravel las recompila sola)
              echo "rm -f bootstrap/cache/routes-*.php"
              echo "rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php"
              # Salir de modo mantenimiento al terminar (ultimo paso)
              echo "rm -f storage/framework/down"
              echo "quit"
            } > /tmp/lftp.cmd

            lftp -f /tmp/lftp.cmd
          else
            echo "Sin cambios en src/, no se sube nada (modo NONE)."
          fi

      - name: Smoke test - verificar que el sitio responde con contenido
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          SITE_URL: https://www.motellosgatitos.cl
        run: |
          set -e

          echo "=== Esperando a que el deploy se propague ==="
          sleep 10

          # 1) Landing: 200 + contenido real (detecta el bug de "200 vacio")
          LANDING=$(curl -sS -o /tmp/landing.html -w "%{http_code} %{size_download}" "$SITE_URL/")
          echo "Landing: $LANDING"
          CODE=$(echo "$LANDING" | awk '{print $1}')
          SIZE=$(echo "$LANDING" | awk '{print $2}')
          [ "$CODE" = "200" ] || { echo "FAIL: landing no devuelve 200"; exit 1; }
          [ "$SIZE" -gt 5000 ] || { echo "FAIL: landing muy pequena ($SIZE bytes) - probable 200 vacio"; exit 1; }

          # 2) Login: 200 + contenido (usa @vite + layout)
          LOGIN=$(curl -sS -o /tmp/login.html -w "%{http_code} %{size_download}" "$SITE_URL/login")
          echo "Login: $LOGIN"
          CODE=$(echo "$LOGIN" | awk '{print $1}')
          SIZE=$(echo "$LOGIN" | awk '{print $2}')
          [ "$CODE" = "200" ] || { echo "FAIL: login no devuelve 200"; exit 1; }
          [ "$SIZE" -gt 1000 ] || { echo "FAIL: login muy pequeno ($SIZE bytes)"; exit 1; }

          # 3) Admin sin sesion: debe redirigir (302) a /login, NO a 200 vacio
          ADMIN=$(curl -sS -o /dev/null -w "%{http_code}" "$SITE_URL/admin")
          echo "Admin (sin sesion): $ADMIN"
          [ "$ADMIN" = "302" ] || { echo "FAIL: /admin deberia redirigir a login (obtuvo $ADMIN)"; exit 1; }

          # 4) API publica de disponibilidad: 200 + JSON valido
          DISPO=$(curl -sS -o /tmp/dispo.json -w "%{http_code}" "$SITE_URL/disponibilidad")
          echo "Disponibilidad: $DISPO"
          [ "$DISPO" = "200" ] || { echo "FAIL: /disponibilidad no responde 200"; exit 1; }
          grep -q '"suites"' /tmp/dispo.json || { echo "FAIL: /disponibilidad no devuelve JSON esperado"; exit 1; }

          # 5) robots.txt: detecta deploys "exitosos" que suben 0 archivos
          #    (el mirror por archivo individual fallaba silenciosamente).
          ROBOTS=$(curl -sS -o /tmp/robots.txt -w "%{http_code}" "$SITE_URL/robots.txt")
          echo "robots.txt: $ROBOTS"
          [ "$ROBOTS" = "200" ] || { echo "FAIL: robots.txt no devuelve 200 (deploy subio 0 archivos?)"; exit 1; }
          grep -q "Sitemap:" /tmp/robots.txt || { echo "FAIL: robots.txt sin Sitemap"; exit 1; }

          # 6) laravel.log: fallar si hay ERROR/FATAL nuevos (post-deploy)
          #    Se descarga via FTP el log y se buscan errores graves.
          echo "=== Revisando laravel.log en busca de errores ==="
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "pget -n 1 -o /tmp/laravel.log storage/logs/laravel.log; quit" 2>/dev/null || echo "No se pudo bajar laravel.log (se ignora)"
          if [ -s /tmp/laravel.log ]; then
            ERRORS=$(grep -cE 'production\.ERROR|FATAL|Uncaught|ParseError|TypeError' /tmp/laravel.log || true)
            echo "Errores graves en laravel.log: $ERRORS"
          else
            echo "laravel.log vacio o no disponible: OK"
          fi

          echo "=== SMOKE TEST COMPLETADO OK ==="
