name: Deploy a Produccion

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (8.3 = server version)
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_mysql, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Prepare files for FTP
        run: |
          cd src
          cp public_html/.htaccess ./

      - name: Debug FTP credentials
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo "User length: ${#FTP_USER}"
          echo "Pass length: ${#FTP_PASS}"
          echo "Host: $FTP_HOST"
          echo "---"
          sudo apt-get install -y -qq curl 2>/dev/null
          echo "=== curl FTP test (plain) ==="
          curl -v --connect-timeout 15 -u "$FTP_USER:$FTP_PASS" ftp://$FTP_HOST/ 2>&1 | head -30
          echo "=== done ==="

      - name: Deploy via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null

          cd src

          {
            echo "set ftp:passive-mode off"
            echo "set ftp:ssl-allow no"
            echo "set net:timeout 300"
            echo "set net:max-retries 5"
            echo "set net:reconnect-interval-base 15"
            echo "set mirror:parallel-transfer-count 10"
            echo "set mirror:use-pget-n 10"
            echo "open -u $FTP_USER,$FTP_PASS $FTP_HOST"
            echo "mirror -R --exclude public_html/ --verbose . /"
            echo "quit"
          } > /tmp/lftp.cmd

          lftp -f /tmp/lftp.cmd
