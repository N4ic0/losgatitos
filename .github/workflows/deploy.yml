name: Deploy a Produccion

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (8.3)
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo_mysql, intl
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: composer-${{ hashFiles('src/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: cd src && composer install --no-dev --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ hashFiles('src/package-lock.json') }}
          restore-keys: npm-

      - name: Install Node dependencies & build assets
        run: cd src && npm ci && npm run build

      - name: Deploy via FTP (only changed files)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp 2>/dev/null

          cd src

          {
            echo "set ftp:passive-mode off"
            echo "set ftp:ssl-allow yes"
            echo "set ssl:verify-certificate no"
            echo "set net:timeout 300"
            echo "set net:max-retries 5"
            echo "set net:reconnect-interval-base 15"
            echo "set mirror:parallel-transfer-count 10"
            echo "set mirror:use-pget-n 10"
            echo "open -u $FTP_USER,$FTP_PASS $FTP_HOST"
            echo "mirror -R --only-newer --exclude node_modules/ --exclude vendor/ --exclude tests/ --exclude .env --exclude .env.example --exclude .gitignore --exclude docker-compose.yml --exclude docker-compose.opencode.yml --exclude Dockerfile --exclude phpunit.xml --exclude README.md --exclude .htaccess --exclude bootstrap/cache/ --exclude public/storage --exclude storage/app/public/ --exclude storage/framework/cache/ --exclude storage/framework/sessions/ --exclude storage/framework/views/ --exclude storage/logs/ --verbose . /"
            echo "rm -f bootstrap/cache/routes-*.php"
            echo "quit"
          } > /tmp/lftp.cmd

          lftp -f /tmp/lftp.cmd
